# The ids each build step claims to cover (PLAN §4 "Covers").
# `quant-check --trace` joins these claims with the ids tests name in @pytest.mark.spec, and a
# step can't merge while one of its claimed ids has no green test. Each step adds its own entry
# in its red commit. Ids are those defined in the tables of SPEC, ARCHITECTURE and PLAN.

[steps.B0]
covers = ["K1", "K2", "K3", "K4", "K5", "K6", "I2", "I3", "I4", "I6", "P2", "P3", "P4", "P11"]

[steps.B1]
covers = ["I1", "I6", "K6", "D1", "D2", "A3", "SPEC§2", "ARCH§3", "ARCH§4.3", "ARCH§5", "ARCH§14"]

[steps.B2]
covers = ["I1", "A2", "C1", "AD2", "SPEC§2", "ARCH§6.1", "ARCH§6.2", "ARCH§6.3", "ARCH§9.1"]

[steps.B3]
covers = ["SPEC§3", "D3", "P8", "I1"]

[steps.B10]
covers = ["A2", "C11", "K5"]

[steps.B9]
covers = [
    "SPEC§10", "D7", "D13", "I4", "C2", "C3", "C8",
    "ARCH§4.4", "ARCH§8.1", "ARCH§8.2", "ARCH§8.3", "ARCH§16",
]

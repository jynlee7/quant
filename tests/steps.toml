# The ids each build step claims to cover (PLAN §4 "Covers").
# `quant-check --trace` joins these claims with the ids tests name in @pytest.mark.spec, and a
# step can't merge while one of its claimed ids has no green test. Each step adds its own entry
# in its red commit. Ids are those defined in the tables of SPEC, ARCHITECTURE and PLAN.

[steps.B0]
covers = ["K1", "K2", "K3", "K4", "K5", "K6", "I2", "I3", "I4", "I6", "P2", "P3", "P4", "P11"]

[steps.B1]
covers = ["I1", "I6", "K6", "D1", "D2", "A3", "SPEC§2", "ARCH§3", "ARCH§4.3", "ARCH§5", "ARCH§14"]

[steps.B2]
covers = ["I1", "A2", "C1", "AD2", "SPEC§2", "ARCH§6.1", "ARCH§6.2", "ARCH§6.3", "ARCH§9.1"]

[steps.B3]
covers = ["SPEC§3", "D3", "P8", "I1"]

[steps.B4]
covers = ["SPEC§4", "SPEC§6", "D4", "T-NL3", "I2", "ARCH§7.1"]

[steps.B10]
covers = ["A2", "C11", "K5"]

[steps.B9]
covers = [
    "SPEC§10", "D7", "D13", "I4", "C2", "C3", "C8",
    "ARCH§4.4", "ARCH§8.1", "ARCH§8.2", "ARCH§8.3", "ARCH§16",
]

[steps.B5]
covers = ["I1", "I2", "T-NL1", "T-NL2"]

# B6a (settings, the data client, the backfill, the quality report) claims the first two lines;
# B6b adds the first model on FIT (D4, SPEC§4, ARCH§7.2), the full tier's T-NL1 on real FIT bars
# (P4, ARCH§13), and the harness's minutes, actions and flags (I1, T-NL1, T-NL2, P3).
[steps.B6]
covers = [
    "D1", "D2", "I5", "I6", "C1", "C8", "K6", "SPEC§2", "PLAN§3",
    "ARCH§2", "ARCH§5", "ARCH§6.1", "ARCH§6.2", "ARCH§6.3", "ARCH§18",
    "D4", "SPEC§4", "C11", "A2", "I1", "T-NL1", "T-NL2", "P3", "P4", "ARCH§7.2", "ARCH§13",
]

# B7a (refit, label matching, the four refit drift checks, the live monitor, ops.db's pointers
# and freeze, activation at the next open, the State Street dividend supplement) claims these;
# B7b adds calibration (SPEC§9, A4, C13, ARCH§7.4) and the refit layers of T-NL1 and T-NL2.
[steps.B7]
covers = [
    "SPEC§5", "D6", "C5", "C7",
    "ARCH§6.2", "ARCH§7.1", "ARCH§7.3", "ARCH§7.5", "ARCH§9.2",
    "SPEC§9", "A4", "C13", "ARCH§7.4", "T-NL1", "T-NL2",
]

# B8a (release r1 and its loader, the playbook schema, engine.yaml, the indicators and the
# primitives with ATR stops, take-profit, re-arm and invalidation, health's rule 6, switching's
# rules 1-5, A1 and invalidation blocks) claims these; B8b adds sizing with C12's Kelly, intents,
# EngineState, DecisionRecord, decide() and the decision layer of T-NL1 and T-NL2.
[steps.B8]
covers = [
    "SPEC§7", "SPEC§8", "SPEC§9", "D2", "D5", "D8", "D9", "A1", "C2", "C4", "C6", "C12", "P7",
    "PLAN§5", "ARCH§4.2", "ARCH§4.3", "ARCH§9.2",
]

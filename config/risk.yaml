# Hard risk limits (SPEC §10, D13), sized for the $100k paper account.
# L3 only: the L1 process can neither read nor write this file. The engine loads it at start,
# freezes it, and refuses to start if it differs from the committed version (ARCHITECTURE §8.1).
# Changing a limit takes a reviewed commit and a restart.

# Exposures are fractions of account equity.
max_gross_exposure: 1.0       # 1.0x gross, long or flat only (D9)
label_caps:                   # the most a BUY may leave held under each active label
  CALM_UP: 1.0
  CHOP: 0.5
  STRESS: 0.25
  CRASH: 0.0
uncertain_cap: 0.0            # rule 5 fired, or no active label
overnight_cap: 0.5            # on the last decision that can fill (A3)
single_order_cap: 0.5         # one order; a full-size entry scales in over two bars

# Losses.
daily_loss_fraction: 0.02     # of start-of-day equity: flatten, no entries until the next session
max_drawdown_fraction: 0.10   # from peak equity: the kill switch

# Manual approval (D7): live orders above this notional wait for you; paper flags them.
manual_approval_notional: 25000.0

# Order rate (C3).
max_intents_per_day: 20       # the 21st intent in a session halts trading
submission_halt_at: 60        # the 60th raw broker submission in a session halts trading

# Prices and freshness.
collar_bp: 10.0               # a limit within +-10 bp of the quote
quote_max_age_s: 5.0
snapshot_max_age_s: 5.0       # the broker snapshot behind reconciliation
